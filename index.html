<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fantasy Draft Statistician</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<style>
  :root{
    --ink:#0e1218; --panel:#161c26; --panel2:#1d2532; --line:#2b3545;
    --text:#e6ebf2; --dim:#8b98ab; --dim2:#5f6c7f;
    --rb:#f0a63c; --wr:#54b6dd; --qb:#b489ef; --te:#63cf94; --k:#94a3b6; --dst:#e07878;
    --good:#5fd39a; --warn:#f0b955; --bad:#f0705f; --hot:#ffd66b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--ink);color:var(--text);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:15px;line-height:1.4;padding-bottom:80px}
  .wrap{max-width:760px;margin:0 auto;padding:0 12px}
  h1{font-size:17px;margin:0;letter-spacing:-.01em}
  .sub{color:var(--dim);font-size:12.5px;margin-top:2px}
  header{position:sticky;top:0;z-index:20;background:var(--ink);
    border-bottom:1px solid var(--line);padding:10px 0 8px}
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .clock{text-align:right;font-variant-numeric:tabular-nums}
  .clock b{font-size:22px;display:block;line-height:1}
  .clock small{color:var(--dim);font-size:11.5px}
  .onclock b{color:var(--hot)}
  .btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:7px;padding:6px 10px;font-size:13px;cursor:pointer}
  .btn:active{background:#28323f}
  .btn.mini{padding:4px 8px;font-size:12px}

  .alert{border-radius:9px;padding:9px 11px;margin:10px 0;font-size:13.5px;
    background:#241d10;border:1px solid #4a3a17;color:#f5d99a}
  .alert b{color:#ffd66b}
  .alert.calm{background:#12211a;border-color:#1e4534;color:#a9dfc4}
  .alert.calm b{color:var(--good)}

  .cliff{display:flex;gap:6px;margin:10px 0 2px;font-size:12px}
  .cl{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:7px;
    padding:6px 4px;text-align:center}
  .cl .p{font-size:11px;color:var(--dim)}
  .cl .v{font-size:16px;font-variant-numeric:tabular-nums;margin-top:1px}
  .cl.hi{border-color:#5c4a1c;background:#1f1b12}
  .cl.hi .v{color:var(--hot)}
  .hint{font-size:11.5px;color:var(--dim2);margin:2px 0 0}

  .rec{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:12px;margin:10px 0}
  .rec h2{font-size:12.5px;color:var(--dim);margin:0 0 9px;font-weight:600}
  .pickcard{display:flex;gap:10px;align-items:flex-start;padding:9px 0;
    border-top:1px solid var(--line)}
  .pickcard:first-of-type{border-top:0}
  .rank{width:20px;font-size:12px;color:var(--dim2);padding-top:3px;
    font-variant-numeric:tabular-nums}
  .pcbody{flex:1;min-width:0}
  .pcname{font-size:16px;font-weight:600;letter-spacing:-.01em}
  .adp{display:inline-block;font-size:11.5px;font-weight:600;vertical-align:2px;
    background:#2b3545;color:#cbd6e5;border-radius:4px;padding:1px 6px;margin-left:6px;
    font-variant-numeric:tabular-nums}
  .pcmeta{font-size:12px;color:var(--dim2);margin-top:2px}
  .pcwhy{font-size:12.5px;color:var(--dim);margin-top:3px}
  .pcwhy .hl{color:var(--good)} .pcwhy .rk{color:var(--warn)}
  .take{background:#20603f;border-color:#2c7d54;color:#dff7e9;white-space:nowrap}

  .tabs{display:flex;gap:6px;margin:12px 0 8px}
  .tab{flex:1;text-align:center;padding:7px;border-radius:7px;font-size:13px;
    background:var(--panel);border:1px solid var(--line);cursor:pointer;color:var(--dim)}
  .tab.on{background:var(--panel2);color:var(--text);border-color:#3d4a5e}
  .filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
  .chip{padding:4px 9px;border-radius:20px;font-size:12px;background:var(--panel);
    border:1px solid var(--line);color:var(--dim);cursor:pointer}
  .chip.on{background:#2c3a4d;color:var(--text);border-color:#48586e}
  input[type=search]{width:100%;background:var(--panel);border:1px solid var(--line);
    color:var(--text);border-radius:7px;padding:8px 10px;font-size:14px;margin-bottom:8px}
  .row{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid #1e2632}
  .pos{width:34px;text-align:center;font-size:11px;font-weight:700;
    border-radius:4px;padding:2px 0;color:#0e1218}
  .RB{background:var(--rb)} .WR{background:var(--wr)} .QB{background:var(--qb)}
  .TE{background:var(--te)} .PK{background:var(--k)} .DEF{background:var(--dst)}
  .nm{flex:1;min-width:0}
  .nm .n{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nm .m{font-size:11.5px;color:var(--dim2);font-variant-numeric:tabular-nums}
  .flag{font-size:11.5px;margin-top:1px}
  .r1{color:var(--dim)} .r2{color:var(--warn)} .r3{color:var(--bad)}
  .acts{display:flex;gap:5px}
  .gone{background:#2a2f38;border-color:#333c48;color:#9aa6b6}
  .rost{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;margin-bottom:10px}
  .slot{display:flex;justify-content:space-between;padding:5px 0;
    border-bottom:1px solid #1e2632;font-size:14px}
  .slot:last-child{border:0}
  .slot .lbl{color:var(--dim);font-size:12px;width:52px;flex:none}
  .empty{color:var(--dim2);font-style:italic}
  .need{font-size:12.5px;color:var(--warn);margin-top:8px}
  .hcrow{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;
    border-bottom:1px solid #1e2632}
  .hcrow span{color:var(--dim2);font-size:11.5px}
  .log{font-size:13px;color:var(--dim);padding:4px 0;border-bottom:1px solid #1e2632;
    display:flex;justify-content:space-between;gap:8px}
  .log b{color:var(--text);font-weight:500}
  .mine{color:var(--hot)}
  footer{position:fixed;bottom:0;left:0;right:0;background:var(--ink);
    border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:8px;
    justify-content:center;z-index:20}
  .note{font-size:11.5px;color:var(--dim2);margin:14px 0 4px}
  h3{font-size:12.5px;color:var(--dim);margin:14px 0 4px;font-weight:600}
</style>
</head>
<body>

<div class="wrap">
<header>
  <div class="hrow">
    <div>
      <h1>Draft board — 12-team PPR</h1>
      <div class="sub">Pick 12 · snake · <span id="avail">0</span> available</div>
    </div>
    <div class="clock" id="clock"><b>—</b><small>—</small></div>
  </div>
</header>

<div id="alert"></div>
<div class="cliff" id="cliff"></div>
<div class="hint">Cost of waiting one turn — how much worse the best player at each spot gets by your next pick.</div>

<div class="rec" id="rec"></div>

<div class="tabs">
  <div class="tab on" data-t="board">Board</div>
  <div class="tab" data-t="team">My team</div>
  <div class="tab" data-t="log">Log</div>
</div>

<div id="board">
  <input type="search" id="q" placeholder="Search player…">
  <div class="filters" id="filters"></div>
  <div id="list"></div>
  <div class="note">Tap <b>Gone</b> when another team takes someone. Tap <b>Mine</b> when you draft.</div>
</div>
<div id="team" style="display:none"></div>
<div id="log" style="display:none"></div>
</div>

<footer>
  <button class="btn" id="undo">Undo last</button>
  <button class="btn" id="reset">Reset draft</button>
</footer>

const PLAYERS = RAW.map((r,i)=>({id:i,name:r[0],pos:r[1],team:r[2],bye:r[3],
  adp:r[4],risk:r[5],note:r[6],hc:r[7],state:0}));

const MY=[]; for(let r=1;r<=16;r++) MY.push(r%2?(r-1)*12+12:(r-1)*12+1);
let history=[];

/* Persistence: localStorage when hosted normally (GitHub Pages, file://),
   falling back to the host-provided window.storage sandbox API. */
const KEY='fds_draft_v1';
function payload(){return JSON.stringify({s:PLAYERS.map(p=>p.state),h:history});}
async function save(){
  try{ localStorage.setItem(KEY,payload()); return; }catch(e){}
  try{ await window.storage.set(KEY,payload()); }catch(e){}
}
function apply(raw){
  if(!raw) return;
  try{ const d=JSON.parse(raw);
    (d.s||[]).forEach((v,i)=>{if(PLAYERS[i])PLAYERS[i].state=v});
    history=d.h||[];
  }catch(e){}
}
async function load(){
  let raw=null;
  try{ raw=localStorage.getItem(KEY); }catch(e){}
  if(!raw){ try{ const r=await window.storage.get(KEY); raw=r&&r.value; }catch(e){} }
  apply(raw);
  render();
}

const picksMade=()=>PLAYERS.filter(p=>p.state>0).length;
const onClock=()=>picksMade()+1;
const roundOf=n=>Math.ceil(n/12);
const myRoster=()=>PLAYERS.filter(p=>p.state===2);
const cnt=p=>myRoster().filter(x=>x.pos===p).length;
function horizon(){const n=onClock();const a=MY.find(p=>p>=n);const b=MY.find(p=>p>a);return[a,b];}

/* how much the best available at a position degrades by your NEXT turn */
function dropoff(pos){
  const [,b]=horizon();
  const av=PLAYERS.filter(p=>p.state===0&&p.pos===pos).sort((x,y)=>x.adp-y.adp);
  if(!av.length) return 0;
  if(!b) return 0;
  const later=av.find(p=>p.adp>=b);
  if(!later) return 0;                       // nobody at this spot survives — but pool is thin anyway
  return Math.min(50, Math.max(0, later.adp-av[0].adp));
}

/* positional run over the last N picks made by OTHER teams */
function run(k=8){
  const last=history.slice(-k).map(e=>PLAYERS[e.id]).filter(p=>p.state===1);
  const c={}; last.forEach(p=>c[p.pos]=(c[p.pos]||0)+1);
  return {c,n:last.length};
}

function needScore(pos,round){
  const rb=cnt('RB'),wr=cnt('WR'),te=cnt('TE'),qb=cnt('QB'),k=cnt('PK'),d=cnt('DEF');
  switch(pos){
    case 'RB':
      if(rb===0) return 30+(round<=6?8:0);
      if(rb===1) return 24+(round<=7?6:0);
      if(rb===2) return 14; if(rb===3) return 8; if(rb===4) return 2; return -12;
    case 'WR':
      if(wr===0) return round<=2?16:24;
      if(wr===1) return 18; if(wr===2) return 11; if(wr===3) return 5;
      if(wr===4) return 0; return -10;
    case 'TE':
      if(te>0) return -70;
      return round<=2?2:round<=6?8:round<=10?12:18;
    case 'QB':
      if(qb>0) return -75;
      return round<=4?-22:round<=7?-4:round<=10?8:20;
    case 'DEF':
      if(d>0) return -200; return round<=11?-120:round<=13?4:30;
    case 'PK':
      if(k>0) return -200; return round<=13?-160:round<=14?2:34;
  }
  return 0;
}
const RISK_PEN=[0,-3,-11,-26];

/* Full-PPR role adjustment. ADP is market consensus across scoring formats;
   this nudges toward players whose value comes from catches. */
const PPR_ADJ={
 "Jahmyr Gibbs":4,"Bijan Robinson":4,"Christian McCaffrey":5,"De'Von Achane":5,
 "Breece Hall":4,"Chase Brown":3,"Saquon Barkley":2,"James Cook III":2,
 "Travis Etienne Jr.":2,"D'Andre Swift":2,"Rhamondre Stevenson":2,"Jaylen Warren":3,
 "Kenny Gainwell":3,"Alvin Kamara":3,"Rachaad White":3,"RJ Harvey":2,"Woody Marks":2,
 "Omarion Hampton":1,"Bucky Irving":1,"Tony Pollard":1,
 "Jonathan Taylor":-2,"Derrick Henry":-7,"David Montgomery":-3,"Quinshon Judkins":-2,
 "Kenneth Walker":-1,"Javonte Williams":-1,"Chuba Hubbard":-1,"Jordan Mason":-3,
 "Tyler Allgeier":-3,"Brian Robinson":-3,"Mike Washington Jr.":-2,
 "Amon-Ra St. Brown":3,"Ladd McConkey":2,"Zay Flowers":2,"Wan'Dale Robinson":3,
 "Khalil Shakir":2,"Josh Downs":2,"Jakobi Meyers":2,"Keenan Allen":2,"Deebo Samuel Sr.":2,
 "Chris Godwin Jr.":2,"Jayden Reed":1,"Puka Nacua":2,
 "Alec Pierce":-3,"Jameson Williams":-2,"Christian Watson":-2,"Rashid Shaheed":-2,
 "Tre Tucker":-2,"Xavier Worthy":-1,"Mike Evans":-1,"Troy Franklin":-2
};
const ppr=n=>PPR_ADJ[n]||0;

function recommend(n=3){
  const [pick]=horizon(); if(!pick) return [];
  const round=roundOf(pick);
  const drops={}; ['RB','WR','TE','QB','DEF','PK'].forEach(p=>drops[p]=dropoff(p));
  return PLAYERS.filter(p=>p.state===0).map(p=>{
    const base=300-p.adp;
    const value=Math.max(-25,Math.min(45,pick-p.adp))*0.75;
    const need=needScore(p.pos,round);
    const cliff=(need>-30? drops[p.pos]*0.55 : 0);   // only counts if you actually need the spot
    return {p,score:base+value+need+cliff+RISK_PEN[p.risk]+ppr(p.name)*1.4,
            value:pick-p.adp,need,cliff:drops[p.pos],round};
  }).sort((a,b)=>b.score-a.score).slice(0,n);
}

const $=id=>document.getElementById(id);
let tab='board',filter='ALL',query='';

function why(r){
  const b=[]; const v=Math.round(r.value);
  if(v>=8) b.push(`<span class="hl">falling ${v} past ADP</span>`);
  else if(v<=-8) b.push(`<span class="rk">reach ${Math.abs(v)} ahead of ADP</span>`);
  const a=ppr(r.p.name);
  if(a>=3) b.push('catches keep his PPR floor high');
  else if(a<=-3) b.push('little receiving work — PPR hurts him');
  if(r.need>=24) b.push('fills your biggest hole');
  else if(r.need>=12) b.push('fits a starting slot');
  else if(r.need<=-40) b.push('spot already filled');
  if(r.cliff>=18) b.push(`${r.p.pos} drops off hard after this`);
  if(r.p.note) b.push(r.p.note);
  return b.join(' · ');
}

function renderTop(){
  const [pick]=horizon(), n=onClock(), c=$('clock');
  if(!pick){c.innerHTML='<b>Done</b><small>16 rounds</small>';c.className='clock';
    $('rec').innerHTML='<h2>Draft complete</h2>';$('alert').innerHTML='';$('cliff').innerHTML='';return;}
  const me=pick===n;
  c.className='clock'+(me?' onclock':'');
  c.innerHTML=`<b>${n}</b><small>Rd ${roundOf(n)} · ${me?'you\u2019re up':'your pick #'+pick}</small>`;

  // cliff bar
  const drops=['RB','WR','TE','QB'].map(p=>({p,d:Math.round(dropoff(p))}));
  const mx=Math.max(...drops.map(x=>x.d));
  $('cliff').innerHTML=drops.map(x=>
    `<div class="cl${x.d>=18&&x.d===mx?' hi':''}"><div class="p">${x.p}</div><div class="v">${x.d?'−'+x.d:'—'}</div></div>`).join('');

  // run alert
  const rr=run(8), rb=rr.c.RB||0, wr=rr.c.WR||0;
  const rbLeftGood=PLAYERS.filter(p=>p.state===0&&p.pos==='RB'&&p.adp<=pick+20&&p.risk<3).length;
  let a='';
  if(rb>=5&&rr.n>=6){
    a = dropoff('RB')>=16 && cnt('RB')<2
      ? `<div class="alert"><b>RB run — ${rb} of the last ${rr.n}.</b> The cliff is still ahead of you and you have ${cnt('RB')} back${cnt('RB')===1?'':'s'}. Taking one here is defensible.</div>`
      : `<div class="alert calm"><b>RB run — ${rb} of the last ${rr.n}.</b> The tier already emptied. Don't chase it — let the elite WRs fall to you and take RB value on the way back.</div>`;
  } else if(wr>=5&&rr.n>=6){
    a=`<div class="alert"><b>WR run — ${wr} of the last ${rr.n}.</b> RBs are sliding. Good time to take the back you'd otherwise reach for.</div>`;
  } else if(cnt('RB')<2 && roundOf(pick)>=6){
    a=`<div class="alert"><b>Only ${cnt('RB')} RB rostered in round ${roundOf(pick)}.</b> ${rbLeftGood} startable backs left near your pick. Don't leave round 7 short.</div>`;
  }
  $('alert').innerHTML=a;

  let h=`<h2>${me?'Take one of these now':'Next pick #'+pick+' (Rd '+roundOf(pick)+') — '+(pick-n)+' away'}</h2>`;
  recommend(3).forEach((r,i)=>{
    h+=`<div class="pickcard"><div class="rank">${i+1}</div><div class="pcbody">
      <div class="pcname">${r.p.name} <span class="adp">ADP ${r.p.adp}</span></div>
      <div class="pcmeta">${r.p.pos} · ${r.p.team} · bye ${r.p.bye}</div>
      <div class="pcwhy">${why(r)}</div></div>
      <button class="btn take" data-mine="${r.p.id}">Mine</button></div>`;
  });
  $('rec').innerHTML=h;
}

function renderBoard(){
  const f=$('filters');
  if(!f.dataset.built){
    f.innerHTML=['ALL','RB','WR','TE','QB','DEF','PK','HC'].map(x=>
      `<div class="chip${x==='ALL'?' on':''}" data-f="${x}">${x==='DEF'?'D/ST':x==='PK'?'K':x==='HC'?'Handcuffs':x}</div>`).join('');
    f.dataset.built=1;
  }
  const q=query.toLowerCase();
  const list=PLAYERS.filter(p=>p.state===0)
    .filter(p=>filter==='ALL'||(filter==='HC'?p.hc:p.pos===filter))
    .filter(p=>!q||p.name.toLowerCase().includes(q)||p.team.toLowerCase()===q)
    .sort((a,b)=>a.adp-b.adp).slice(0,130);
  $('list').innerHTML=list.map(p=>`
    <div class="row"><div class="pos ${p.pos}">${p.pos==='DEF'?'DST':p.pos==='PK'?'K':p.pos}</div>
      <div class="nm"><div class="n">${p.name}</div>
      <div class="m">${p.team} · bye ${p.bye} · ADP ${p.adp}</div>
      ${p.note?`<div class="flag r${Math.max(1,p.risk)}">${p.note}</div>`:''}</div>
      <div class="acts"><button class="btn mini gone" data-gone="${p.id}">Gone</button>
      <button class="btn mini take" data-mine="${p.id}">Mine</button></div></div>`).join('')
    || '<div class="note">No players match.</div>';
  $('avail').textContent=PLAYERS.filter(p=>p.state===0).length;
}

function renderTeam(){
  const r=myRoster(), by=p=>r.filter(x=>x.pos===p);
  const rb=by('RB'),wr=by('WR'),te=by('TE'),qb=by('QB'),k=by('PK'),d=by('DEF');
  const flex=[...rb.slice(2),...wr.slice(2),...te.slice(1)].sort((a,b)=>a.adp-b.adp);
  const slot=(l,p)=>`<div class="slot"><span class="lbl">${l}</span><span>${p?p.name+' <span style="color:var(--dim2);font-size:12px">'+p.team+' · bye '+p.bye+'</span><span class="adp">'+p.adp+'</span>':'<span class="empty">open</span>'}</span></div>`;
  let h='<div class="rost">'+slot('QB',qb[0])+slot('RB1',rb[0])+slot('RB2',rb[1])
    +slot('WR1',wr[0])+slot('WR2',wr[1])+slot('TE',te[0])+slot('FLEX',flex[0])
    +slot('D/ST',d[0])+slot('K',k[0])+'</div>';

  const gaps=[];
  if(rb.length<2)gaps.push(`${2-rb.length} starting RB`);
  if(wr.length<2)gaps.push(`${2-wr.length} starting WR`);
  if(!te.length)gaps.push('TE'); if(!qb.length)gaps.push('QB');
  if(!flex.length)gaps.push('FLEX'); if(!d.length)gaps.push('D/ST'); if(!k.length)gaps.push('K');
  const bench=r.filter(p=>![qb[0],rb[0],rb[1],wr[0],wr[1],te[0],flex[0],d[0],k[0]].includes(p));
  h+=`<div class="rost"><div class="slot" style="border:0"><span class="lbl">Bench</span><span>${
    bench.length?bench.map(p=>`${p.name} <span style="color:var(--dim2);font-size:11.5px">(${p.pos} ${p.adp})</span>`).join(', '):'<span class="empty">none yet</span>'}</span></div>
    ${gaps.length?`<div class="need">Still need: ${gaps.join(', ')}</div>`
      :'<div class="need" style="color:var(--good)">Starting lineup is full.</div>'}</div>`;

  const byes={};
  [qb[0],rb[0],rb[1],wr[0],wr[1],te[0],flex[0]].filter(Boolean).forEach(p=>byes[p.bye]=(byes[p.bye]||0)+1);
  const clash=Object.entries(byes).filter(([,c])=>c>=3);
  if(clash.length)h+=`<div class="note" style="color:var(--warn)">Bye stack: ${
    clash.map(([w,c])=>`week ${w} (${c} starters)`).join(', ')}</div>`;

  const hc=PLAYERS.filter(p=>p.state===0&&p.hc).sort((a,b)=>a.adp-b.adp).slice(0,10);
  h+='<h3>Contingency backs still on the board</h3><div class="rost">'+
    hc.map(p=>`<div class="hcrow"><b>${p.name}</b><span>${p.team} · ADP ${p.adp}</span></div>`).join('')+'</div>';
  $('team').innerHTML=h;
}

function renderLog(){
  const picks=history.map((e,i)=>({p:PLAYERS[e.id],n:i+1}));
  $('log').innerHTML=picks.length
    ? picks.slice().reverse().map(x=>`<div class="log"><b class="${x.p.state===2?'mine':''}">${x.n}. ${x.p.name}</b><span>${x.p.pos} ${x.p.team} · ADP ${x.p.adp}${x.p.state===2?' — you':''}</span></div>`).join('')
    : '<div class="note">No picks logged yet.</div>';
}

function render(){
  renderTop();
  ['board','team','log'].forEach(t=>$(t).style.display=tab===t?'':'none');
  if(tab==='board')renderBoard(); if(tab==='team')renderTeam(); if(tab==='log')renderLog();
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('on',el.dataset.t===tab));
}
function setState(id,st){const p=PLAYERS[id];if(!p||p.state!==0)return;
  history.push({id});p.state=st;save();render();}
document.addEventListener('click',e=>{const t=e.target;
  if(t.dataset.gone!=null&&t.dataset.gone!=='') return setState(+t.dataset.gone,1);
  if(t.dataset.mine!=null&&t.dataset.mine!=='') return setState(+t.dataset.mine,2);
  if(t.dataset.f){filter=t.dataset.f;
    document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===t));renderBoard();return;}
  if(t.dataset.t){tab=t.dataset.t;render();return;}
});
$('q').addEventListener('input',e=>{query=e.target.value;renderBoard()});
$('undo').addEventListener('click',()=>{const l=history.pop();if(!l)return;
  PLAYERS[l.id].state=0;save();render();});
let armed=null;
$('reset').addEventListener('click',()=>{
  const b=$('reset');
  if(!armed){
    armed=setTimeout(()=>{armed=null;b.textContent='Reset draft';
      b.style.background='';b.style.borderColor='';b.style.color='';},4000);
    b.textContent='Tap again to erase';
    b.style.background='#5a1f1f';b.style.borderColor='#8a3030';b.style.color='#ffdede';
    return;
  }
  clearTimeout(armed);armed=null;
  b.textContent='Reset draft';b.style.background='';b.style.borderColor='';b.style.color='';
  PLAYERS.forEach(p=>p.state=0);history=[];save();render();
});
load();
</script>
